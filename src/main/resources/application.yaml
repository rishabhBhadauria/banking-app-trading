spring:
  datasource:
    url: jdbc:mysql://localhost:3306/banking_app_trader
    username: root        # or root
    password: admin     # your password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  docker:
    compose:
      enabled: false
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  web:
    error:
      include-stacktrace: never
      include-message: always
